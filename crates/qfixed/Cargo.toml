[package]
name = "qfixed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
description = "Bit-accurate fixed-point types with Q-notation for RTL digital twin modeling"

[features]
default = []
# Enables the growable packed containers (`PackedVec`, `PackedBitsVec`), which
# need an allocator. Pulls in the `alloc` crate only; no external dependency.
alloc = []
serde = ["dep:serde"]

[dependencies]
typenum = { version = "1", default-features = false }
serde = { version = "1", default-features = false, optional = true }

[dev-dependencies]
# Token-stream round-trip testing for the serde impls. Depends only on `serde`
# (already in the graph), so it introduces no new licenses for cargo-deny.
serde_test = "1"

# Build docs.rs with the full feature surface (serde + alloc) so the optional
# APIs are documented. `--cfg docsrs` is set to enable future `doc(cfg(...))`
# feature-badge gating without another metadata change.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
