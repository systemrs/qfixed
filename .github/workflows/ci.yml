name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on pull requests, but never cancel a run on master
# (otherwise a rapid second push could leave a commit with no completed checks).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: build, test, lint, audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the SAME image used for local development
      # (.devcontainer/Dockerfile). It already carries the pinned Rust toolchain
      # (rust-toolchain.toml) plus cargo-deny and cargo-audit, so CI and the
      # devcontainer run identical tooling. Claude Code is skipped to keep the
      # CI image lean. GitHub Actions layer caching makes subsequent runs fast —
      # the slow `cargo install` layer is only rebuilt when its inputs change.
      - name: Build dev container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          build-args: INSTALL_CLAUDE_CODE=false
          tags: qfixed-dev:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the shared verification suite inside that image. scripts/ci.sh is the
      # single source of truth for what runs (fmt, clippy default + all-features
      # + release, build, test debug + release, doc, cargo-deny, cargo-audit) and
      # is runnable locally too. --user root avoids a uid mismatch with the
      # bind-mounted checkout.
      - name: Run checks in container
        run: |
          docker run --rm \
            --user root \
            -e CARGO_TERM_COLOR=always \
            -v "${{ github.workspace }}:/workspaces/qfixed" \
            -w /workspaces/qfixed \
            qfixed-dev:ci \
            bash scripts/ci.sh

      # Verify the crate actually builds and tests on its declared MSRV
      # (rust-version = "1.90" in Cargo.toml). Reuses the same image and installs
      # 1.90.0 on top; `cargo +1.90.0` overrides the pinned default for these
      # commands. fmt/clippy are intentionally NOT run on the MSRV (lint and
      # format output drift between compiler versions).
      - name: Verify MSRV (Rust 1.90) builds and tests
        run: |
          docker run --rm \
            --user root \
            -e CARGO_TERM_COLOR=always \
            -v "${{ github.workspace }}:/workspaces/qfixed" \
            -w /workspaces/qfixed \
            qfixed-dev:ci \
            bash -c 'set -euo pipefail; \
              git config --global --add safe.directory "$(pwd)"; \
              rustup toolchain install 1.90.0 --profile minimal; \
              cargo +1.90.0 build --locked --workspace --all-features; \
              cargo +1.90.0 test --locked --workspace --all-features'
